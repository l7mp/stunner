site_name: STUNner
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://docs.l7mp.io/en/latest/']
repo_url: https://github.com/l7mp/stunner
edit_uri: edit/main/docs/
site_description: "Documentation of STUNner"
site_author: L7mp Technologies Kft.
copyright: L7mp Technologies Kft.
use_directory_urls: true
theme:
  name: readthedocs
  highlightjs: true
# the build requirements of the docs are not part of the site
exclude_docs: |
  /requirements.*
nav:
- 'Overview':
  - 'Why STUNner': 'WHY.md'
  - 'Deployment models': 'DEPLOYMENT.md'
  - 'Concepts': 'CONCEPTS.md'
  - 'Free vs. premium tiers': 'TIERS.md'
- 'Getting started':
  - 'Installation: Free tier': 'INSTALL.md'
  - 'Installation: Premium tiers': 'PREMIUM_INSTALL/'
- 'User guides':
  - 'Authentication': 'AUTH.md'
  - 'Monitoring': 'MONITORING.md'
  - 'Scaling': 'SCALING.md'
  - 'Security': 'SECURITY.md'
  - 'Reference: Free tier': 'GATEWAY.md'
  - 'Reference: Premium tiers': 'PREMIUM_REFERENCE/'
- 'Tutorials':
  - 'Configuring TLS for tutorials': 'examples/TLS.md'
  - 'Basics':
    - 'Deploying a UDP echo service behind STUNner': 'examples/udp-echo/README.md'
    - 'Opening a UDP tunnel via STUNner': 'examples/simple-tunnel/README.md'
  - 'Headless deployment model':
    - 'Direct one to one video call via STUNner': 'examples/direct-one2one-call/README.md'
  - 'Media-plane deployment model':
    - 'Video-conferencing with LiveKit': 'examples/livekit/README.md'
    - 'Video-conferencing with mediasoup': 'examples/mediasoup/README.md'
    - 'Video-conferencing with Janus': 'examples/janus/README.md'
    - 'Video-conferencing with Elixir WebRTC': 'examples/elixir-webrtc/README.md'
    - 'Video-conferencing with Jitsi': 'examples/jitsi/README.md'
    - 'Cloud-gaming with CloudRetro': 'examples/cloudretro/README.md'
    - 'Remote desktop access with Neko': 'examples/neko/README.md'
    - 'One to one video call with Kurento': 'examples/kurento-one2one-call/README.md'
    - 'Magic mirror with Kurento': 'examples/kurento-magic-mirror/README.md'
  - 'Benchmarking': 'examples/benchmark/README.md'
- 'CMD':
  - 'stunnerctl': 'cmd/stunnerctl.md'
  - 'stunnerd': 'cmd/stunnerd.md'
  - 'icetester': 'cmd/icetester.md'
- 'Premium':
  - 'Getting started': 'PREMIUM_INSTALL.md'
  - 'Features': 'PREMIUM_REFERENCE.md'
plugins:
  - search
markdown_extensions:
  - admonition
  # highlight.js colors the code in the browser
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - gfm_admonition
