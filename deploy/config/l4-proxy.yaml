# An L4 proxy terminating TLS and DTLS: TLS/443 is relayed as TCP and DTLS/443 as UDP to a
# backend, round-robin over the endpoints.
version: v2
admin:
  name: l4-proxy
  loglevel: all:INFO
listeners:
  - name: tls
    protocol: TLS
    port: 443
    cert: "$STUNNER_TLS_CERT"
    key: "$STUNNER_TLS_KEY"
    servers: [tls-to-tcp]
  - name: dtls
    protocol: DTLS
    port: 443
    cert: "$STUNNER_TLS_CERT"
    key: "$STUNNER_TLS_KEY"
    servers: [dtls-to-udp]
servers:
  - name: tls-to-tcp
    type: L4
    clusters: [backend-tcp]
  - name: dtls-to-udp
    type: L4
    clusters: [backend-udp]
clusters:
  - name: backend-tcp
    protocol: TCP
    endpoints: ["10.0.0.1:8080"]
  - name: backend-udp
    protocol: UDP
    endpoints: ["10.0.0.2:8080"]
