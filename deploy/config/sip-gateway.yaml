# An inbound SIP gateway: the carriers in 203.0.113.0/24 start calls on UDP/5060, the SIP server
# proxies them to a SIP backend, and the RTP server relays their media on UDP/30000 to the media
# peers in 10.0.0.0/8, controlled by the SIP server over ng on an in-process fifo.
version: v2
admin:
  name: sip-gateway
  loglevel: all:INFO
auths:
  - name: default
    type: none
listeners:
  - name: sip
    protocol: UDP
    port: 5060
    servers: [sip]
    filters: [carriers]
  - name: media
    protocol: UDP
    port: 30000
    servers: [rtp]
    filters: [carriers]
  - name: rtp-ng
    protocol: FIFO
    address: rtp-ng
    servers: [rtp]
    labels: {role: control}
servers:
  - name: sip
    type: SIP
    clusters: [sip-backend]
    sip:
      public_address: "$STUNNER_ADDR"
      public_port: 5060
      media_proxy: rtp-ng
  - name: rtp
    type: RTP
    clusters: [media-peers]
    rtp:
      public_address: "$STUNNER_ADDR"
      public_port: 30000
clusters:
  - name: sip-backend
    protocol: UDP
    routing_policy: ROUND_ROBIN
    endpoints: ["$SIP_BACKEND:5060"]
  - name: media-peers
    protocol: UDP
    addresses: ["$STUNNER_ADDR"]
    filters: [media]
  - name: rtp-ng
    protocol: FIFO
    addresses: [rtp-ng]
filters:
  - name: carriers
    rules:
      - action: ALLOW
        ip_block: {cidr: 203.0.113.0/24}
      - action: DENY
  - name: media
    rules:
      - action: ALLOW
        ip_block: {cidr: 10.0.0.0/8}
      - action: DENY
