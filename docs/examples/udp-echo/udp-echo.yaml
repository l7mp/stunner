apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-plane
  namespace: default
  labels:
    app: media-plane
spec:
  selector:
    matchLabels:
      app: media-plane
  template:
    metadata:
      labels:
        app: media-plane
    spec:
      containers:
      - image: docker.io/l7mp/mediactl:latest
        name: mediactl
        command: ["mediactl", "udp", "echo", ":9001"]

---
apiVersion: v1
kind: Service
metadata:
  name: media-plane
  namespace: default
  labels:
    app: media-plane
spec:
  ports:
  - port: 9001
    protocol: UDP
  selector:
    app: media-plane
  type: ClusterIP
