name: Run End-to-End Test (stable)

on:
  workflow_dispatch:
  schedule:
  - cron: '0 11 1-7,15-21 * 2'

jobs:
  e2e_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Build stunnerd
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o stunnerd ./cmd/stunnerd

      - name: Start minikube
        uses: medyagh/setup-minikube@master
        with:
          driver: docker
          container-runtime: containerd
          wait: all
          cache: false

      - name: Start minikube tunnel
        run: minikube tunnel &>mktunnel.log &

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Install STUNner
        run: |
          helm repo add stunner https://l7mp.io/stunner
          helm repo update
          helm install stunner stunner/stunner --create-namespace --namespace=stunner --set stunnerGatewayOperator.deployment.container.manager.resources.requests.cpu=200m  --set stunnerGatewayOperator.dataplane.spec.resources.requests.cpu=100m

      - name: Deploy iperf server
        run: kubectl apply -f docs/examples/simple-tunnel/iperf-server.yaml

      - name: Configure STUNner
        run: |
          kubectl apply -f docs/examples/simple-tunnel/iperf-stunner.yaml

      - name: Install iperf client
        run: |
          sudo apt-get update
          sudo apt-get -y install iperf

      - name: Wait for STUNner and the iperf server
        run: |
          timeout 5m bash -c 'until kubectl get -n stunner deployment udp-gateway &>/dev/null; do echo "Waiting for the udp-gateway deployment"; sleep 2; done'
          kubectl wait -n stunner --for=condition=Available deployment udp-gateway --timeout 5m
          kubectl wait --for=condition=Available deployment iperf-server --timeout 5m
          timeout 2m bash -c 'until [[ -n $(kubectl get svc udp-gateway -n stunner -o jsonpath="{.status.loadBalancer.ingress[0].ip}") ]]; do echo "Waiting for LoadBalancer IP"; sleep 2; done'
          kubectl get all -A

      - name: Start the tunnel
        run: |
          ./stunnerd --log=all:INFO udp://127.0.0.1:5000 k8s://stunner/udp-gateway:udp-listener k8s://default/iperf-server:iperf-udp &>tunnel.log &
          pid=$!
          for n in {1..30}; do
            ss -Hlun 'sport = :5000' | grep -q . && exit 0
            kill -0 $pid 2>/dev/null || { echo "stunnerd exited"; cat tunnel.log; exit 1; }
            echo "Waiting for the tunnel"; sleep 1
          done
          echo "Timed out waiting for the tunnel"; cat tunnel.log; exit 1

      - name: Run iperf client
        run: |
          set -o pipefail
          iperf -c 127.0.0.1 -p 5000 -u -l 100 -b 5M -t 5 | tee iperf.log

      - name: Show logs
        if: always()
        run: |
          echo "* IPERF"
          echo "** Client"
          cat iperf.log || true
          echo "** Server"
          kubectl logs $(kubectl get pods -l app=iperf-server -o jsonpath='{.items[0].metadata.name}') || true
          echo "* MINIKUBE TUNNEL"
          cat mktunnel.log || true
          echo "* TUNNEL"
          cat tunnel.log || true
          echo "* STUNNER"
          kubectl logs -n stunner $(kubectl get pods -n stunner -l app=stunner -o jsonpath='{.items[0].metadata.name}') || true
          echo "* STUNNER-GATEWAY=OPERATOR"
          kubectl logs -n stunner $(kubectl get pods -n stunner -l control-plane=stunner-gateway-operator-controller-manager -o jsonpath='{.items[0].metadata.name}') || true

      - name: Check iperf conectivity
        run: grep "Server Report" iperf.log
