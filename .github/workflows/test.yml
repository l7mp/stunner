name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Download modules
        run: go mod download
      - name: Go install
        run: go install
      - name: Test
        run: go test -v -covermode=count -coverprofile=coverage.out
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        if: github.repository == 'l7mp/stunner'
        with:
          github-token: ${{ secrets.github_token }}
          file: coverage.out
          format: golang
  seccheck:
    name: Security Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Check security vulnerabilites
        id: scan
        uses: anchore/scan-action@v7
        with:
          path: "."
          fail-build: true
          severity-cutoff: critical
          output-format: table
          output-file: grype-results.txt
      - name: Surface vulnerability report
        if: always()
        run: |
          echo "::group::Grype vulnerability report"
          cat grype-results.txt || echo "no grype report was produced"
          echo "::endgroup::"

  # The official images are built in the private workspace from the heads of the OSS repos: a
  # tested push to main starts that build. PRIV_WORKSPACE_TOKEN is a fine-grained token limited
  # to l7mp/priv-workspace.
  notify-priv-workspace:
    name: Start the private workspace build
    needs: [test, seccheck]
    if: github.repository == 'l7mp/stunner' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PRIV_WORKSPACE_TOKEN }}
          repository: l7mp/priv-workspace
          event-type: oss-push
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
